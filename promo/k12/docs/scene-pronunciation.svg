<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#eef6ff"/><text x="80" y="100" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#121826">单词不只会翻译，还能马上跟读</text><rect x="120" y="170" width="1040" height="390" rx="32" fill="#fff" stroke="#d9e0e8" filter="drop-shadow(0 20px 44px rgba(18,24,38,.16))"/><rect x="170" y="220" width="60" height="50" rx="14" fill="#087eff"/><text x="184" y="252" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#fff">Lee</text><text x="255" y="252" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#121826">FloatTranslate</text><text x="170" y="345" font-family="Arial, sans-serif" font-size="78" font-weight="900" fill="#121826">skill</text><text x="175" y="405" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#087eff">英音 /skɪl/ · 美音 /skɪl/</text><rect x="175" y="445" width="155" height="52" rx="26" fill="#dcebff"/><text x="208" y="479" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#087eff">▶ 英音</text><rect x="350" y="445" width="155" height="52" rx="26" fill="#dcebff"/><text x="383" y="479" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#087eff">▶ 美音</text><g fill="#087eff"><rect x="760" y="285" width="12" height="70" rx="6"/><rect x="790" y="255" width="12" height="130" rx="6"/><rect x="820" y="300" width="12" height="40" rx="6"/><rect x="850" y="238" width="12" height="164" rx="6"/><rect x="880" y="275" width="12" height="92" rx="6"/><rect x="910" y="310" width="12" height="35" rx="6"/></g><text x="735" y="455" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#121826">听一下，再跟读</text></svg>